name: tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: visor-v2.1-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Verify exact-run discovery contract
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/resolve_ci_run.ps1 -Repo "${{ github.repository }}" -CommitSha "${{ github.event.pull_request.head.sha }}" -Workflow "tests.yml" -Event "pull_request" -TimeoutSeconds 60 -PollSeconds 3 -Quiet
          if ($LASTEXITCODE -ne 0 -or -not $runId -or $runId -notmatch '^\d+$') {
            Write-Error "Exact-run discovery contract failed."
            exit 1
          }
          Write-Host "Resolved current workflow run: $runId"
      - name: Parse PowerShell release scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $allErrors = @()
          foreach ($path in @('scripts/publish_release.ps1', 'scripts/resolve_ci_run.ps1')) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            $allErrors += $errors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - run: python scripts/rebuild_scenarios.py
      - run: python scripts/build_data_dictionary.py
      - run: python scripts/sync_public_data.py
      - run: python scripts/build_static_viewer.py
      - run: python -m compileall -q app.py scripts tests
      - run: python scripts/clean_runtime_artifacts.py
      - run: python scripts/normalize_release_text.py
      - run: python scripts/preflight_check.py
      - run: python scripts/validate_phase8.py
      - run: python scripts/audit_release_hygiene.py
      - run: python scripts/build_release_manifest.py
      - run: python scripts/normalize_release_text.py
      - run: pytest -q
      - run: python scripts/audit_release_independence.py
      - run: python scripts/audit_release_hygiene.py
      - run: python scripts/secret_scan.py
      - run: python scripts/build_release_manifest.py --check
      - run: git diff --check
      - run: python scripts/check_git_clean.py
