name: candidate-bootstrap
on:
  push:
    branches: ["codex/v2.1.0-scientific-refactor"]
permissions:
  contents: write
jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, '[materialized]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed candidate patch
        run: |
          cat .candidate_patch.part* > .candidate_v2_1.patch
          git apply --index --binary .candidate_v2_1.patch
          git rm .candidate_patch.part*
          rm .candidate_v2_1.patch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild generated scientific products
        run: |
          pip install -r requirements.txt pytest
          python scripts/rebuild_scenarios.py
          python scripts/build_data_dictionary.py
          python scripts/sync_public_data.py
          python scripts/build_static_viewer.py
          python -m compileall -q app.py scripts tests
          python scripts/preflight_check.py
          python scripts/secret_scan.py
          python scripts/build_release_manifest.py
          pytest -q
          python scripts/build_release_manifest.py --check
      - name: Commit materialized candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Scientific refactor v2.1.0-rc.1 phases 1-7 [materialized]"
          git push origin HEAD:codex/v2.1.0-scientific-refactor
