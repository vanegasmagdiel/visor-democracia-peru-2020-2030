[project]
name = "visor-democracia-peru"
version = "2.0.0"
description = "Visor integrado 2020-2030 del Democracy Index para Peru"
requires-python = ">=3.11"
dependencies = [
  "shiny>=1.4,<2",
  "shinywidgets>=0.7,<1",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "plotly>=6,<7"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
